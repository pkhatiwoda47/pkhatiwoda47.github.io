<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | {{ site.name }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="stylesheet" href="{{ site.baseurl }}/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="container header-inner">
        <a class="brand" href="{{ site.baseurl }}/">
          {{ site.name }}
          <small>{{ site.description }}</small>
        </a>

        <nav class="nav-links">
          <a href="{{ site.baseurl }}/blog">Blog</a>
          <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch theme">Light</button>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="page-section">
        <div class="page-header">
          <h1>{{ page.title }}</h1>
          {% if page.subtitle %}
            <p class="page-subtitle">{{ page.subtitle }}</p>
          {% endif %}
        </div>

        <div class="page-content">
          {{ content }}
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.name }}. All rights reserved.</p>
    </footer>

    <script>
      (function () {
        var storageKey = "site-theme";
        var themeToggle = document.getElementById("theme-toggle");

        function applyTheme(theme) {
          var isLight = theme === "light";
          document.body.classList.toggle("theme-light", isLight);
          if (themeToggle) {
            themeToggle.textContent = isLight ? "Dark" : "Light";
          }
        }

        var savedTheme = "dark";
        try {
          savedTheme = localStorage.getItem(storageKey) || "dark";
        } catch (e) {
          savedTheme = "dark";
        }
        applyTheme(savedTheme);

        if (themeToggle) {
          themeToggle.addEventListener("click", function () {
            var nextTheme = document.body.classList.contains("theme-light") ? "dark" : "light";
            try {
              localStorage.setItem(storageKey, nextTheme);
            } catch (e) {}
            applyTheme(nextTheme);
          });
        }
      })();
    </script>
  </body>
</html>
